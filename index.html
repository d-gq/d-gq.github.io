<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to hell</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===== CONTENEDOR PRINCIPAL ===== */
        .media-player {
            width: 1000px;
            max-width: 100%;
            background: #0f0f0f;
            border: 2px solid #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(180, 0, 0, 0.15);
            position: relative;
        }

        /* ===== BANDA ROJA SUPERIOR ===== */
        .top-bar {
            background: linear-gradient(90deg, #8b0000, #cc0000, #8b0000);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #550000;
        }
        .top-bar .title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            letter-spacing: 2px;
        }
        .top-bar .title span {
            color: #ff8888;
        }

        /* ===== PESTAÑAS ===== */
        .tabs {
            display: flex;
            background: #1a1a1a;
            border-bottom: 2px solid #2a0000;
            padding: 0 15px;
            gap: 5px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #888;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 12px 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            letter-spacing: 1px;
        }
        .tab-btn:hover {
            color: #fff;
            background: rgba(139, 0, 0, 0.2);
        }
        .tab-btn.active {
            color: #ff3333;
            border-bottom-color: #cc0000;
            background: rgba(139, 0, 0, 0.15);
        }

        /* ===== CONTENEDOR DE CONTENIDO ===== */
        .content-area {
            position: relative;
            min-height: 420px;
            background: #0a0a0a;
            overflow: hidden;
        }

        /* ===== CADA PANEL ===== */
        .panel {
            display: none;
            padding: 25px 30px 30px 30px;
            animation: fadeIn 0.4s ease;
            min-height: 380px;
        }
        .panel.active {
            display: block;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ===== HOME ===== */
        .home-container {
            position: relative;
            height: 400px;
            overflow: hidden;
            background: #0a0a0a;
            border-radius: 4px;
        }
        .home-scroll {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            animation: scrollUpHome 45s linear infinite;
            padding: 10px 0;
        }
        @keyframes scrollUpHome {
            0% { transform: translateY(0); opacity: 0; }
            8% { opacity: 1; }
            92% { opacity: 1; }
            100% { transform: translateY(-100%); opacity: 0; }
        }
        .home-scroll .info-line {
            font-size: 0.95rem;
            color: #ffaa55;
            text-shadow: 0 0 12px #ff660044;
            padding: 5px 0;
            border-bottom: 1px solid #2a0a0a;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding-right: 10px;
        }
        .home-scroll .info-line .label {
            color: #ff8844;
            font-weight: 400;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .home-scroll .info-line .value {
            color: #ffeecc;
            font-weight: 600;
            text-align: right;
            word-break: break-all;
            max-width: 65%;
        }
        .home-footer {
            margin-top: 15px;
            font-size: 0.7rem;
            color: #442222;
            letter-spacing: 6px;
            text-align: center;
            font-family: 'Georgia', serif;
        }

        /* ===== BOTÓN PLAY (solo en Home) ===== */
        .play-btn-wrapper {
            position: absolute;
            bottom: 20px;
            right: 25px;
            z-index: 10;
        }
        .play-btn {
            background: rgba(20, 0, 0, 0.85);
            border: 2px solid #8b0000;
            border-radius: 50%;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #ff4444;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
        }
        .play-btn:hover {
            background: #8b0000;
            color: #fff;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.6);
            transform: scale(1.05);
        }
        .play-btn.paused {
            color: #ff8888;
        }

        /* ===== BOTONES DE REDES (Vampyr, Demian, Paradise) ===== */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-top: 15px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .social-btn {
            background: #0f0f0f;
            border: 2px solid #8b0000;
            border-radius: 10px;
            padding: 16px 10px;
            text-align: center;
            color: #ff6644;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(139, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .social-btn:hover {
            background: #8b0000;
            color: #fff;
            box-shadow: 0 0 35px rgba(139, 0, 0, 0.5);
            transform: scale(1.03);
            border-color: #ff3333;
        }
        .social-btn .icon {
            font-size: 1.3rem;
        }
        .social-btn.discord-copy {
            background: #0a0a2a;
            border-color: #4444aa;
        }
        .social-btn.discord-copy:hover {
            background: #4444aa;
            border-color: #8888ff;
        }

        .panel-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 2rem;
            color: #ff2222;
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }
        .panel-sub {
            text-align: center;
            color: #662222;
            font-size: 0.8rem;
            letter-spacing: 6px;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 700px) {
            .top-bar .title { font-size: 1.2rem; }
            .tab-btn { font-size: 0.8rem; padding: 10px 14px; }
            .panel { padding: 15px; }
            .home-container { height: 320px; }
            .home-scroll .info-line { font-size: 0.75rem; flex-direction: column; align-items: flex-start; gap: 2px; }
            .home-scroll .info-line .value { text-align: left; max-width: 100%; }
            .social-grid { grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
            .social-btn { font-size: 0.9rem; padding: 12px 8px; }
            .play-btn { width: 48px; height: 48px; font-size: 1.4rem; bottom: 15px; right: 18px; }
            .panel-title { font-size: 1.5rem; }
        }
        @media (max-width: 450px) {
            .top-bar { flex-direction: column; gap: 6px; padding: 10px 15px; }
            .top-bar .title { font-size: 1rem; }
            .tabs { justify-content: center; padding: 0 8px; gap: 2px; }
            .tab-btn { font-size: 0.7rem; padding: 8px 10px; }
            .social-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .home-container { height: 280px; }
        }
    </style>
</head>
<body>

<div class="media-player">

    <!-- ===== BANDA ROJA ===== -->
    <div class="top-bar">
        <div class="title"> <span>Welcome</span> to hell</div>
        <div style="font-size:0.7rem; color:#ff8888; letter-spacing:3px; opacity:0.6;">⛧ INFERNO ⛧</div>
    </div>

    <!-- ===== PESTAÑAS ===== -->
    <div class="tabs" id="tabContainer">
        <button class="tab-btn active" data-tab="home">Home</button>
        <button class="tab-btn" data-tab="vampyr">Vampyr</button>
        <button class="tab-btn" data-tab="demian">Demian</button>
        <button class="tab-btn" data-tab="paradise">Paradise</button>
    </div>

    <!-- ===== CONTENIDO ===== -->
    <div class="content-area">

        <!-- ========== HOME ========== -->
        <div class="panel active" id="panel-home">
            <div class="home-container" id="homeContainer">
                <div class="home-scroll" id="homeScroll">
                    <!-- La info se inyecta con JS -->
                    <div class="home-footer">⛧ ⛧ ⛧</div>
                </div>
                <!-- Botón PLAY -->
                <div class="play-btn-wrapper">
                    <button class="play-btn" id="playBtn" title="Pausar / reanudar música">⏸</button>
                </div>
            </div>
        </div>

        <!-- ========== VAMPYR ========== -->
        <div class="panel" id="panel-vampyr">
            <div class="panel-title"> Vampyr </div>
            <div class="panel-sub">Primer Dios</div>
            <div class="social-grid" id="social-vampyr">
                <!-- Generado con JS -->
            </div>
        </div>

        <!-- ========== DEMIAN ========== -->
        <div class="panel" id="panel-demian">
            <div class="panel-title"> Demian </div>
            <div class="panel-sub">Segundo dios</div>
            <div class="social-grid" id="social-demian">
                <!-- Generado con JS -->
            </div>
        </div>

        <!-- ========== PARADISE ========== -->
        <div class="panel" id="panel-paradise">
            <div class="panel-title"> Paradise </div>
            <div class="panel-sub">Tercer Dios</div>
            <div class="social-grid" id="social-paradise">

        </div>

    </div><!-- /.content-area -->
</div><!-- /.media-player -->

<!-- ===== AUDIO OCULTO ===== -->
<audio id="audioPlayer" loop></audio>

<!-- ============================================================ -->
<!-- JAVASCRIPT -->
<!-- ============================================================ -->
<script>
    (function() {
        "use strict";

        // ============================================================
        // 1. ELEMENTOS
        // ============================================================
        const tabs = document.querySelectorAll('.tab-btn');
        const panels = {
            home: document.getElementById('panel-home'),
            vampyr: document.getElementById('panel-vampyr'),
            demian: document.getElementById('panel-demian'),
            paradise: document.getElementById('panel-paradise'),
        };
        const homeScroll = document.getElementById('homeScroll');
        const playBtn = document.getElementById('playBtn');
        const audioPlayer = document.getElementById('audioPlayer');

        // ============================================================
        // 2. CANCIÓN (cambia aquí si quieres otra)
        // ============================================================
        const SONG_URL = 'https://d-gq.github.io/cachalot.mp3';
        let isPlaying = false;

        // ============================================================
        // 3. RECOLECTAR INFORMACIÓN + CIUDAD/ISP
        // ============================================================
        function recolectarInfoCompleta(callback) {
            const info = {};
            info.ip = 'CARGANDO...';
            info.ciudad = 'CARGANDO...';
            info.isp = 'CARGANDO...';
            info.pais = 'CARGANDO...';

            // Datos del navegador
            info.navegador = navigator.userAgentData ?
                navigator.userAgentData.brands.map(b => b.brand).join(', ') :
                (navigator.userAgent.match(/(Chrome|Firefox|Safari|Edge|Opera)/) || ['Desconocido'])[0];
            info.user_agent = navigator.userAgent;
            const os = navigator.userAgent.match(/(Windows NT|Mac OS X|Linux|Android|iOS|CrOS)/);
            info.so = os ? os[0] : 'Desconocido';
            info.plataforma = navigator.platform || 'Desconocida';
            info.idioma = navigator.language || (navigator.languages ? navigator.languages[0] : 'Desconocido');
            info.resolucion = window.screen.width + 'x' + window.screen.height;
            info.resolucion_disponible = window.screen.availWidth + 'x' + window.screen.availHeight;
            info.color = window.screen.colorDepth + ' bits';
            info.zona = Intl.DateTimeFormat().resolvedOptions().timeZone;
            info.offset = new Date().getTimezoneOffset() / -60 + 'h';
            const ahora = new Date();
            info.fecha = ahora.toLocaleString('es-ES', { timeZone: info.zona });
            info.fecha_utc = ahora.toISOString();

            if (navigator.connection) {
                info.conexion = navigator.connection.effectiveType || 'Desconocido';
                info.velocidad = navigator.connection.downlink ? navigator.connection.downlink + ' Mbps' : 'Desconocido';
                info.latencia = navigator.connection.rtt ? navigator.connection.rtt + ' ms' : 'Desconocido';
                info.save_data = navigator.connection.saveData ? 'ACTIVADO' : 'DESACTIVADO';
            } else {
                info.conexion = 'Desconocido';
                info.velocidad = 'Desconocido';
                info.latencia = 'Desconocido';
                info.save_data = 'Desconocido';
            }

            info.cpu = navigator.hardwareConcurrency || 'Desconocido';
            info.ram = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Desconocida';
            info.touch_points = navigator.maxTouchPoints || 0;

            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        info.gpu_vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) || 'Desconocido';
                        info.gpu = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) || 'Desconocido';
                    }
                }
            } catch (e) {
                info.gpu_vendor = 'No disponible';
                info.gpu = 'No disponible';
            }

            info.cookies = navigator.cookieEnabled ? 'SI' : 'NO';
            info.dnt = navigator.doNotTrack || 'No especificado';
            info.referer = document.referrer || 'Directo';
            info.ventana = window.innerWidth + 'x' + window.innerHeight;
            info.oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'SI' : 'NO';
            info.movimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'SI' : 'NO';
            info.orientacion = screen.orientation ? screen.orientation.type : (window.innerWidth > window.innerHeight ? 'horizontal' :
                'vertical');
            info.fullscreen = document.fullscreenEnabled ? 'SI' : 'NO';

            try {
                const plugins = [];
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push(navigator.plugins[i].name);
                }
                info.plugins = plugins.join(', ') || 'Ninguno';
            } catch (e) {
                info.plugins = 'No accesible';
            }

            // Obtener IP, ciudad e ISP
            fetch('https://ipapi.co/json/')
                .then(r => r.json())
                .then(data => {
                    info.ip = data.ip || 'NO DETECTADA';
                    info.ciudad = data.city || 'Desconocida';
                    info.isp = data.org || 'Desconocido';
                    info.pais = data.country_name || 'Desconocido';
                    callback(info);
                })
                .catch(() => {
                    // Fallback a ipify.org si ipapi falla
                    fetch('https://api.ipify.org?format=json')
                        .then(r => r.json())
                        .then(data => {
                            info.ip = data.ip || 'NO DETECTADA';
                            // Intentamos geolocalización con ip-api.com
                            fetch('http://ip-api.com/json/' + info.ip + '?fields=city,isp,country')
                                .then(r => r.json())
                                .then(geo => {
                                    info.ciudad = geo.city || 'Desconocida';
                                    info.isp = geo.isp || 'Desconocido';
                                    info.pais = geo.country || 'Desconocido';
                                    callback(info);
                                })
                                .catch(() => {
                                    callback(info);
                                });
                        })
                        .catch(() => {
                            callback(info);
                        });
                });
        }

        // ============================================================
        // 4. GENERAR HTML DE INFO (HOME)
        // ============================================================
        function generarInfoHTML(info) {
            const items = [
                { label: 'IP', value: info.ip },
                { label: 'CIUDAD', value: info.ciudad + ' (' + info.pais + ')' },
                { label: 'PROVEEDOR', value: info.isp },
                { label: 'NAVEGADOR', value: info.navegador },
                { label: 'USER AGENT', value: info.user_agent },
                { label: 'SISTEMA OPERATIVO', value: info.so },
                { label: 'PLATAFORMA', value: info.plataforma },
                { label: 'IDIOMA', value: info.idioma },
                { label: 'RESOLUCIÓN', value: info.resolucion },
                { label: 'RESOLUCIÓN DISPONIBLE', value: info.resolucion_disponible },
                { label: 'PROFUNDIDAD COLOR', value: info.color },
                { label: 'ZONA HORARIA', value: info.zona + ' (UTC' + info.offset + ')' },
                { label: 'FECHA/HORA LOCAL', value: info.fecha },
                { label: 'FECHA/HORA UTC', value: info.fecha_utc },
                { label: 'TIPO CONEXIÓN', value: info.conexion },
                { label: 'VELOCIDAD', value: info.velocidad },
                { label: 'LATENCIA', value: info.latencia },
                { label: 'AHORRO DE DATOS', value: info.save_data },
                { label: 'NÚCLEOS CPU', value: info.cpu },
                { label: 'MEMORIA RAM', value: info.ram },
                { label: 'PUNTOS TÁCTILES', value: info.touch_points },
                { label: 'GPU VENDOR', value: info.gpu_vendor },
                { label: 'GPU RENDERER', value: info.gpu },
                { label: 'MODO OSCURO', value: info.oscuro },
                { label: 'MOVIMIENTO REDUCIDO', value: info.movimiento },
                { label: 'COOKIES', value: info.cookies },
                { label: 'DO NOT TRACK', value: info.dnt },
                { label: 'ORIENTACIÓN', value: info.orientacion },
                { label: 'VENTANA', value: info.ventana },
                { label: 'PANTALLA COMPLETA', value: info.fullscreen },
                { label: 'REFERER', value: info.referer },
                { label: 'PLUGINS', value: info.plugins }
            ];

            let html = '';
            items.forEach(item => {
                const val = String(item.value);
                if (val && val !== 'Desconocido' && val !== 'No disponible' && val !== 'No accesible' && val !==
                    'Ninguno' && val !== 'CARGANDO...') {
                    html += `<div class="info-line">
                        <span class="label">▸ ${item.label}</span>
                        <span class="value">${val}</span>
                    </div>`;
                }
            });
            html += '<div class="home-footer">⛧ ⛧ ⛧</div>';
            return html;
        }

        // ============================================================
        // 5. GENERAR BOTONES SOCIALES
        // ============================================================
        function generarBotones(perfiles) {
            let html = '';
            perfiles.forEach(p => {
                if (p.tipo === 'discord') {
                    html += `
                        <button class="social-btn discord-copy" data-copy="${p.valor}">
                            <span class="icon">💬</span> Discord
                        </button>
                    `;
                } else if (p.tipo === 'link') {
                    html += `
                        <a href="${p.url}" target="_blank" class="social-btn">
                            <span class="icon">${p.icono || '🔗'}</span> ${p.nombre}
                        </a>
                    `;
                }
            });
            return html;
        }

        // ============================================================
        // 6. DATOS DE PERFILES POR PESTAÑA
        // ============================================================
        const perfiles = {
            vampyr: [
                { tipo: 'link', nombre: 'Roblox', url: 'https://www.roblox.com/es/users/10752298002/profile',
                icono: '' },
                { tipo: 'link', nombre: 'Instagram', url: 'https://www.instagram.com/omofagia', icono: '' },
                { tipo: 'discord', valor: 'v.y.r' },
                { tipo: 'link', nombre: 'Telegram', url: 'https://t.me/caquexia', icono: '' },
                { tipo: 'link', nombre: 'GitHub', url: 'https://github.com/d-gq', icono: '' },
            ],
            demian: [
                { tipo: 'link', nombre: 'Roblox', url: 'https://www.roblox.com/es/users/2011849227/profile',
                icono: '' },
                { tipo: 'link', nombre: 'Instagram', url: 'https://www.instagram.com/intoxicatorio', icono: '' },
                { tipo: 'discord', valor: '6vjy' },
            ],
            paradise: [
                { tipo: 'link', nombre: 'Roblox', url: 'https://www.roblox.com/es/users/2292725732/profile',
                icono: '' },
                { tipo: 'link', nombre: 'Instagram', url: 'https://www.instagram.com/dormitado', icono: '' },
                { tipo: 'discord', valor: '60x4' },
            ]
        };

        // ============================================================
        // 7. FUNCIÓN PARA COPIAR AL PORTAPAPELES
        // ============================================================
        function copiarAlPortapapeles(texto) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(texto)
                    .then(() => {
                        mostrarNotificacion(' Copiado: ' + texto);
                    })
                    .catch(() => {
                        copiarFallback(texto);
                    });
            } else {
                copiarFallback(texto);
            }
        }

        function copiarFallback(texto) {
            const input = document.createElement('input');
            input.value = texto;
            input.style.position = 'fixed';
            input.style.opacity = '0';
            input.style.pointerEvents = 'none';
            document.body.appendChild(input);
            input.select();
            try {
                document.execCommand('copy');
                mostrarNotificacion(' Copiado: ' + texto);
            } catch (e) {
                mostrarNotificacion(' Error al copiar');
            }
            document.body.removeChild(input);
        }

        function mostrarNotificacion(mensaje) {
            const div = document.createElement('div');
            div.textContent = mensaje;
            div.style.cssText = `
                position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
                background: #0a0a0a; color: #ff6644; padding: 12px 28px;
                border: 2px solid #8b0000; border-radius: 8px;
                font-family: 'Segoe UI', sans-serif; font-weight: 600;
                z-index: 9999; box-shadow: 0 0 40px rgba(139,0,0,0.4);
                letter-spacing: 1px; text-align: center;
                animation: fadeIn 0.3s ease;
            `;
            document.body.appendChild(div);
            setTimeout(() => {
                div.style.opacity = '0';
                div.style.transition = 'opacity 0.5s ease';
                setTimeout(() => div.remove(), 600);
            }, 2500);
        }

        // ============================================================
        // 8. INICIALIZAR PESTAÑAS
        // ============================================================
        function initTabs() {
            tabs.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabs.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const tab = this.dataset.tab;
                    Object.keys(panels).forEach(key => {
                        panels[key].classList.toggle('active', key === tab);
                    });
                    // Reiniciar animación de scroll en Home si cambiamos a Home
                    if (tab === 'home') {
                        const scroll = document.getElementById('homeScroll');
                        scroll.style.animation = 'none';
                        setTimeout(() => {
                            scroll.style.animation = 'scrollUpHome 45s linear infinite';
                        }, 50);
                    }
                });
            });
        }

        // ============================================================
        // 9. INICIALIZAR TODO
        // ============================================================
        function init() {
            // Cargar info en Home
            recolectarInfoCompleta(function(info) {
                homeScroll.innerHTML = generarInfoHTML(info);
            });

            // Generar botones sociales en cada panel
            document.getElementById('social-vampyr').innerHTML = generarBotones(perfiles.vampyr);
            document.getElementById('social-demian').innerHTML = generarBotones(perfiles.demian);
            document.getElementById('social-paradise').innerHTML = generarBotones(perfiles.paradise);

            // Evento copiar para botones Discord
            document.querySelectorAll('.discord-copy').forEach(btn => {
                btn.addEventListener('click', function() {
                    const texto = this.dataset.copy;
                    if (texto) copiarAlPortapapeles(texto);
                });
            });

            // Pestañas
            initTabs();

            // ============================================================
            // 10. REPRODUCTOR DE MÚSICA
            // ============================================================
            audioPlayer.src = SONG_URL;
            audioPlayer.volume = 0.7;
            audioPlayer.loop = true;

            // Intentar reproducir al cargar (solo si el usuario ha interactuado antes)
            // Lo dejamos preparado pero no reproducimos hasta que el usuario haga clic en Play

            playBtn.addEventListener('click', function() {
                if (audioPlayer.paused) {
                    audioPlayer.play().catch(e => console.log('Error al reproducir:', e));
                    playBtn.textContent = '⏸';
                    playBtn.classList.remove('paused');
                    isPlaying = true;
                } else {
                    audioPlayer.pause();
                    playBtn.textContent = '▶';
                    playBtn.classList.add('paused');
                    isPlaying = false;
                }
            });

            // Si el audio se bloquea por políticas del navegador, mostramos mensaje
            audioPlayer.addEventListener('error', function(e) {
                console.log('Error de audio:', e);
            });

            // Al terminar la canción (por si no tiene loop), reiniciar
            audioPlayer.addEventListener('ended', function() {
                if (isPlaying) {
                    audioPlayer.currentTime = 0;
                    audioPlayer.play().catch(() => {});
                }
            });

            // Forzar primer clic en la página para desbloquear audio en algunos navegadores
            document.addEventListener('click', function unlockAudio() {
                if (audioPlayer.paused && !audioPlayer.src) {
                    audioPlayer.src = SONG_URL;
                }
                // No reproducimos automáticamente, solo preparamos
            }, { once: true });

            console.log(' Welcome to hell - Cargado correctamente');
        }

        // Ejecutar cuando DOM esté listo
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

    })();
</script>
</body>
</html>
