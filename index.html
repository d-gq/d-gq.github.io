<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paradise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_5340.ico"> 
    
    <!-- Firebase SDK -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js"
      }
    }
    </script>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ============================================================
           THEMES (LIGHT / DARK)
           ============================================================ */
        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        body.light-mode .container { background: #ffffff; }
        body.light-mode .top-bar { background: #ffffff; border-bottom-color: #eee; }
        body.light-mode .top-bar .title { color: #1a1a1a; }
        body.light-mode .top-bar .badge { background: #f5f5f5; border-color: #eee; color: #888; }
        body.light-mode .top-bar .separator { color: #ddd; }
        body.light-mode .tabs { background: #fafafa; border-bottom-color: #eee; }
        body.light-mode .tab-btn { color: #888; }
        body.light-mode .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
        body.light-mode .tab-btn:hover { color: #333; background: rgba(0,0,0,0.03); }
        body.light-mode .home-container { background: #fafafa; border-color: #eee; }
        body.light-mode .home-greeting { color: #1a1a1a; }
        body.light-mode .home-greeting span { color: #888; }
        body.light-mode .home-footer { color: #ccc; }
        body.light-mode .music-player { background: #fafafa; border-color: #eee; }
        body.light-mode .music-player .song-title { color: #1a1a1a; }
        body.light-mode .music-player .song-artist { color: #888; }
        body.light-mode .music-player .controls button { color: #555; }
        body.light-mode .music-player .controls button:hover { color: #1a1a1a; background: #eee; }
        body.light-mode .music-player .controls .play-btn { color: #1a1a1a; }
        body.light-mode .progress-bar { background: #e0e0e0; }
        body.light-mode .progress-bar .progress-fill { background: #1a1a1a; }
        body.light-mode .time-info { color: #999; }
        body.light-mode .lyrics-container { background: #fafafa; border-color: #eee; color: #444; }
        body.light-mode .social-btn { background: #f5f5f5; border-color: #e8e8e8; color: #333; }
        body.light-mode .social-btn:hover { background: #eee; border-color: #ccc; }
        body.light-mode .playlist-item { border-bottom-color: #f0f0f0; color: #333; }
        body.light-mode .playlist-item:hover { background: #f5f5f5; }
        body.light-mode .playlist-item.active { background: #f0f0f0; }
        body.light-mode #loginScreen { background: #ffffff; }
        body.light-mode #loginScreen .title { color: #1a1a1a; }
        body.light-mode #loginScreen .login-box input { background: #fafafa; border-color: #ddd; color: #1a1a1a; }
        body.light-mode #loginScreen .login-box input:focus { border-color: #1a1a1a; background: #ffffff; }
        body.light-mode #loginScreen .login-box button { background: #1a1a1a; color: #ffffff; }
        body.light-mode #loginScreen .login-box button:hover { background: #333; }
        body.light-mode .panel-title { color: #1a1a1a; }
        body.light-mode .panel-sub { color: #999; }
        body.light-mode #themeToggle { border-color: #ddd; color: #333; }
        body.light-mode #themeToggle:hover { background: #eee; }

        body.dark-mode {
            background: #0a0a0a;
            color: #eee;
        }
        body.dark-mode .container { background: #111; }
        body.dark-mode .top-bar { background: #1a1a1a; border-bottom-color: #2a2a2a; }
        body.dark-mode .top-bar .title { color: #eee; }
        body.dark-mode .top-bar .badge { background: #2a2a2a; border-color: #333; color: #aaa; }
        body.dark-mode .top-bar .separator { color: #444; }
        body.dark-mode .tabs { background: #1a1a1a; border-bottom-color: #2a2a2a; }
        body.dark-mode .tab-btn { color: #888; }
        body.dark-mode .tab-btn.active { color: #eee; border-bottom-color: #eee; }
        body.dark-mode .tab-btn:hover { color: #eee; background: rgba(255,255,255,0.05); }
        body.dark-mode .home-container { background: #1a1a1a; border-color: #2a2a2a; }
        body.dark-mode .home-greeting { color: #eee; }
        body.dark-mode .home-greeting span { color: #888; }
        body.dark-mode .home-footer { color: #444; }
        body.dark-mode .music-player { background: #1a1a1a; border-color: #2a2a2a; }
        body.dark-mode .music-player .song-title { color: #eee; }
        body.dark-mode .music-player .song-artist { color: #888; }
        body.dark-mode .music-player .controls button { color: #888; }
        body.dark-mode .music-player .controls button:hover { color: #eee; background: #2a2a2a; }
        body.dark-mode .music-player .controls .play-btn { color: #eee; }
        body.dark-mode .progress-bar { background: #2a2a2a; }
        body.dark-mode .progress-bar .progress-fill { background: #eee; }
        body.dark-mode .time-info { color: #888; }
        body.dark-mode .lyrics-container { background: #1a1a1a; border-color: #2a2a2a; color: #aaa; }
        body.dark-mode .social-btn { background: #1a1a1a; border-color: #2a2a2a; color: #888; }
        body.dark-mode .social-btn:hover { background: #2a2a2a; border-color: #444; color: #eee; }
        body.dark-mode .playlist-item { border-bottom-color: #2a2a2a; color: #888; }
        body.dark-mode .playlist-item:hover { background: #1a1a1a; }
        body.dark-mode .playlist-item.active { background: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen { background: #0a0a0a; }
        body.dark-mode #loginScreen .title { color: #eee; }
        body.dark-mode #loginScreen .title span { color: #888; }
        body.dark-mode #loginScreen .login-box input { background: #1a1a1a; border-color: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen .login-box input:focus { border-color: #eee; background: #1a1a1a; }
        body.dark-mode #loginScreen .login-box button { background: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen .login-box button:hover { background: #333; }
        body.dark-mode .panel-title { color: #eee; }
        body.dark-mode .panel-sub { color: #888; }
        body.dark-mode #themeToggle { border-color: #444; color: #ccc; }
        body.dark-mode #themeToggle:hover { background: #2a2a2a; }

        /* ============================================================
           COMMON ELEMENTS
           ============================================================ */
        #themeToggle {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }
        #loginScreen .title {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }
        #loginScreen .title span { color: #888; font-weight: 300; }
        #loginScreen .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 320px;
            max-width: 90%;
        }
        #loginScreen .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        #loginScreen .login-box input:focus { border-color: #1a1a1a; }
        #loginScreen .login-box button {
            width: 100%;
            padding: 14px 18px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
            letter-spacing: 2px;
        }
        #loginScreen .login-box button:hover {
            background: #cc0000;
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(204, 0, 0, 0.3);
        }
        #loginScreen .login-box .error {
            color: #cc3333;
            font-size: 0.85rem;
            font-weight: 400;
            height: 20px;
            text-align: center;
        }

        .container {
            width: 900px;
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.8s ease, background 0.3s ease;
            position: relative;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }
        .container.active { opacity: 1; }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            border-radius: 16px;
        }

        .top-bar {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .top-bar .title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }
        .top-bar .title span { font-weight: 300; transition: color 0.3s ease; }
        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.3s ease;
            flex-wrap: wrap;
        }
        .top-bar .right .badge {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #eee;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .top-bar .right .badge .icon { font-size: 0.8rem; opacity: 0.6; }
        .top-bar .right .separator { transition: color 0.3s ease; }

        .tabs {
            display: flex;
            padding: 0 20px;
            gap: 4px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            overflow-x: auto;
            transition: all 0.3s ease;
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .content-area {
            padding: 30px 35px;
            min-height: 380px;
            position: relative;
            z-index: 1;
            flex: 1;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        .panel {
            display: none;
            animation: fadeIn 0.3s ease;
            height: 100%;
        }
        .panel.active { display: block; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .home-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 380px;
            border-radius: 10px;
            border: 1px solid #eee;
            padding: 30px;
            transition: all 0.3s ease;
        }
        .home-greeting {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }
        .home-greeting span { font-weight: 300; transition: color 0.3s ease; }
        .home-footer {
            margin-top: 25px;
            font-size: 0.6rem;
            letter-spacing: 4px;
            transition: color 0.3s ease;
        }

        /* ============================================================
           MUSIC (CORREGIDO)
           ============================================================ */
        .music-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            height: 380px;
            overflow-y: auto;
            padding-right: 5px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .music-container::-webkit-scrollbar { width: 4px; }
        .music-container::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
        .music-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .music-player {
            width: 100%;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .music-player .song-title {
            font-size: 1.2rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .music-player .song-artist {
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        .music-player .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 5px;
        }
        .music-player .controls button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .music-player .controls .play-btn { font-size: 2rem; }
        .music-player .progress-bar {
            width: 100%;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s ease;
        }
        .music-player .progress-bar .progress-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear, background 0.3s ease;
        }
        .music-player .time-info {
            font-size: 0.7rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transition: color 0.3s ease;
        }

        .playlist {
            width: 100%;
            flex-shrink: 0;
        }
        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
        }
        .playlist-item .title { font-size: 0.95rem; }
        .playlist-item .duration { font-size: 0.8rem; }

        .music-sub-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 16px;
            width: 100%;
        }
        .music-sub-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #888;
        }
        .music-sub-btn:hover { color: #333; }
        .music-sub-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
        body.dark-mode .music-sub-btn.active { color: #eee; border-bottom-color: #eee; }

        .music-panel {
            display: none;
            width: 100%;
        }
        .music-panel.active { display: block; }

        .lyrics-container {
            height: 380px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #eee;
            padding: 25px 30px;
            font-family: 'Inter', sans-serif;
            line-height: 2;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafafa;
            width: 100%;
        }
        .lyrics-container::-webkit-scrollbar { width: 4px; }
        .lyrics-container::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
        .lyrics-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        .lyrics-container .line { padding: 2px 0; }
        .lyrics-container .line.empty { height: 12px; }

        /* ===== SOCIAL ===== */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .social-btn {
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            padding: 14px 12px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            display: block;
            letter-spacing: 0.3px;
        }
        .social-btn:hover { background: #eee; border-color: #ccc; }

        .panel-title {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }
        .panel-sub {
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        @media (max-width: 700px) {
            .top-bar { padding: 16px 20px; flex-direction: column; gap: 8px; }
            .top-bar .title { font-size: 1.1rem; }
            .top-bar .right { font-size: 0.7rem; gap: 8px; justify-content: center; }
            .top-bar .right .badge { padding: 3px 10px; font-size: 0.7rem; }
            .tab-btn { font-size: 0.8rem; padding: 10px 14px; }
            .content-area { padding: 20px; }
            .home-container { height: 320px; padding: 20px; }
            .home-greeting { font-size: 1.8rem; }
            .lyrics-container { height: 320px; padding: 20px; font-size: 0.9rem; }
            .music-container { height: 320px; max-width: 100%; }
            .music-player { padding: 16px 18px; }
            .social-grid { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
            .social-btn { font-size: 0.8rem; padding: 10px 6px; }
            .panel-title { font-size: 1.4rem; }
            #loginScreen .title { font-size: 1.8rem; }
            #loginScreen .login-box { width: 260px; }
            #loginScreen .login-box button { font-size: 1rem; padding: 12px 16px; }
            .music-sub-btn { font-size: 0.75rem; padding: 4px 12px; }
        }
        @media (max-width: 450px) {
            .tabs { justify-content: center; padding: 0 10px; gap: 2px; }
            .tab-btn { font-size: 0.7rem; padding: 8px 12px; }
            .social-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
            .home-container { height: 260px; }
            .home-greeting { font-size: 1.4rem; }
            .lyrics-container { height: 260px; padding: 15px; font-size: 0.8rem; }
            .music-container { height: 260px; max-width: 100%; }
            .music-player { padding: 12px 14px; }
            .music-player .controls button { font-size: 1.2rem; }
            .music-player .controls .play-btn { font-size: 1.6rem; }
            .playlist-item { padding: 8px 12px; font-size: 0.85rem; }
            .social-btn { font-size: 0.75rem; padding: 8px 4px; }
            .top-bar .right .badge { font-size: 0.6rem; padding: 2px 8px; }
            #loginScreen .title { font-size: 1.4rem; }
            #loginScreen .login-box { width: 220px; }
            #loginScreen .login-box input { padding: 10px 14px; font-size: 0.9rem; }
            #loginScreen .login-box button { font-size: 0.9rem; padding: 10px 14px; }
            .music-sub-btn { font-size: 0.7rem; padding: 3px 8px; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN (SOLO NOMBRE) ===== -->
    <div id="loginScreen">
        <div class="title">✦ <span>Welcome</span></div>
        <div class="login-box">
            <input type="text" id="nameInput" placeholder="Enter your name..." autofocus />
            <button id="loginBtn">Give your soul</button>
            <div class="error" id="loginError"></div>
        </div>
    </div>

    <!-- ===== CONTENEDOR PRINCIPAL ===== -->
    <div class="container" id="mainContainer">
        <canvas id="particles-canvas"></canvas>

        <div class="top-bar">
            <div class="title">✦ <span id="greetingDisplay">Welcome</span></div>
            <div class="right">
                <span class="badge" id="ipBadge">
                    <span class="icon">◈</span>
                    <span id="ipDisplay">0.0.0.0</span>
                </span>
                <span class="separator">|</span>
                <span class="badge" id="clockBadge">
                    <span id="clockDisplay">--:--:--</span>
                </span>
                <span class="separator">|</span>
                <span class="badge" id="visitasBadge">
                    <span class="icon">◈</span>
                    <span id="visitasDisplay">0</span>
                </span>
                <span class="separator">|</span>
                <button id="themeToggle" title="Toggle theme">◈</button>
            </div>
        </div>

        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-tab="home">Home</button>
            <button class="tab-btn" data-tab="music">Music</button>
            <button class="tab-btn" data-tab="about">Social</button>
        </div>

        <div class="content-area">

            <!-- ===== HOME ===== -->
            <div class="panel active" id="panel-home">
                <div class="home-container">
                    <div class="home-greeting">Hey, <span id="userNameDisplay">guest</span></div>

        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + String(secs).padStart(2, '0');

    // ============================================================

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => showNotification('Copied: ' + text))
                .catch(() => copyFallback(text));
        } else {
            copyFallback(text);
        }
    }

    function copyFallback(text) {
        const input = document.createElement('input');
        input.value = text;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try {
            document.execCommand('copy');
            showNotification('Copied: ' + text);
        } catch (e) {
            showNotification('Error copying');
        }
        document.body.removeChild(input);
    }

    function showNotification(msg) {
        const div = document.createElement('div');
        div.textContent = msg;
        div.style.cssText = `
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #f5f5f5; color: #333; padding: 12px 28px;
            border: 1px solid #ddd; border-radius: 8px;

            z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,0.08);

    // ============================================================
    // 16. PARTICLES
    // ============================================================
    function initParticles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            const rect = mainContainer.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            canvas.width = width;
            canvas.height = height;
        }

        function createParticles(count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: 1.5 + Math.random() * 2,
                    alpha: 0.2 + Math.random() * 0.3,
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, width, height);
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,' + p.alpha + ')';
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
            }
            requestAnimationFrame(drawParticles);
        }

        resize();
        createParticles(45);
        drawParticles();

        window.addEventListener('resize', () => {
            resize();
            createParticles(45);
        });
    }
