<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paradise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_5340.ico"> 
    
    <!-- Firebase SDK -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js"
      }
    }
    </script>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        /* ============================================================
           TEMAS (LIGHT / DARK)
           ============================================================ */
        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        body.light-mode .container { background: #ffffff; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
        body.light-mode .top-bar { border-bottom-color: #eee; }
        body.light-mode .top-bar .badge { background: #f5f5f5; border-color: #eee; color: #888; }
        body.light-mode .tabs { border-bottom-color: #eee; background: #fafafa; }
        body.light-mode .tab-btn { color: #888; }
        body.light-mode .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
        body.light-mode .home-container { background: #fafafa; border-color: #eee; }
        body.light-mode .music-player { background: #fafafa; border-color: #eee; }
        body.light-mode .lyrics-container { background: #fafafa; border-color: #eee; color: #444; }
        body.light-mode .social-card { background: #ffffff; border-color: #eee; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        body.light-mode .social-link { background: #f5f5f5; border-color: #e8e8e8; color: #333; }
        body.light-mode .social-link:hover { background: #eee; border-color: #ccc; }
        body.light-mode #loginScreen { background: #ffffff; }
        body.light-mode #loginScreen .login-box input { background: #fafafa; border-color: #ddd; }
        body.light-mode #loginScreen .login-box input:focus { border-color: #1a1a1a; background: #ffffff; }
        body.light-mode #loginScreen .login-box button { background: #1a1a1a; color: #ffffff; }
        body.light-mode #loginScreen .login-box button:hover { background: #333; }
        body.light-mode .panel-title { color: #1a1a1a; }
        body.light-mode .panel-sub { color: #999; }
        body.light-mode #themeToggle { border-color: #ddd; color: #333; }
        body.light-mode #themeToggle:hover { background: #eee; }
        body.light-mode .music-sub-btn { color: #888; }
        body.light-mode .music-sub-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
        body.light-mode .music-sub-btn:hover { color: #333; }
        body.light-mode .home-footer { color: #ccc; }
        body.light-mode .platform-stats { color: #666; }

        body.dark-mode {
            background: #0a0a0a;
            color: #eee;
        }
        body.dark-mode .container { background: #111; box-shadow: 0 4px 24px rgba(0,0,0,0.3); }
        body.dark-mode .top-bar { border-bottom-color: #2a2a2a; }
        body.dark-mode .top-bar .badge { background: #1a1a1a; border-color: #2a2a2a; color: #888; }
        body.dark-mode .tabs { border-bottom-color: #2a2a2a; background: #1a1a1a; }
        body.dark-mode .tab-btn { color: #888; }
        body.dark-mode .tab-btn.active { color: #eee; border-bottom-color: #eee; }
        body.dark-mode .home-container { background: #1a1a1a; border-color: #2a2a2a; }
        body.dark-mode .music-player { background: #1a1a1a; border-color: #2a2a2a; }
        body.dark-mode .lyrics-container { background: #1a1a1a; border-color: #2a2a2a; color: #aaa; }
        body.dark-mode .social-card { background: #1a1a1a; border-color: #2a2a2a; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
        body.dark-mode .social-link { background: #1a1a1a; border-color: #2a2a2a; color: #888; }
        body.dark-mode .social-link:hover { background: #2a2a2a; border-color: #444; }
        body.dark-mode #loginScreen { background: #0a0a0a; }
        body.dark-mode #loginScreen .login-box input { background: #1a1a1a; border-color: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen .login-box input:focus { border-color: #eee; background: #1a1a1a; }
        body.dark-mode #loginScreen .login-box button { background: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen .login-box button:hover { background: #333; }
        body.dark-mode .panel-title { color: #eee; }
        body.dark-mode .panel-sub { color: #888; }
        body.dark-mode #themeToggle { border-color: #444; color: #ccc; }
        body.dark-mode #themeToggle:hover { background: #2a2a2a; }
        body.dark-mode .music-sub-btn { color: #888; }
        body.dark-mode .music-sub-btn.active { color: #eee; border-bottom-color: #eee; }
        body.dark-mode .music-sub-btn:hover { color: #eee; }
        body.dark-mode .home-footer { color: #444; }
        body.dark-mode .platform-stats { color: #888; }

        /* ============================================================
           ANIMACIONES
           ============================================================ */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           COMMON ELEMENTS
           ============================================================ */
        #themeToggle {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        /* ===== LOGIN ===== */
        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }
        #loginScreen .title {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }
        #loginScreen .title span { color: #888; font-weight: 300; }
        #loginScreen .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 320px;
            max-width: 90%;
        }
        #loginScreen .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        #loginScreen .login-box input:focus { border-color: #1a1a1a; }
        #loginScreen .login-box button {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 2px;
        }
        #loginScreen .login-box .error {
            color: #cc3333;
            font-size: 0.85rem;
            height: 20px;
            text-align: center;
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 900px;
            max-width: 100%;
            border-radius: 16px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.6s ease;
            position: relative;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }
        .container.active {
            opacity: 1;
            animation: fadeInUp 0.4s ease;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            transition: border-color 0.2s ease;
        }
        .top-bar .title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }
        .top-bar .title span { font-weight: 300; }
        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 400;
            flex-wrap: wrap;
        }
        .top-bar .right .badge {
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #eee;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }
        .top-bar .right .badge .icon { font-size: 0.8rem; opacity: 0.5; }
        .top-bar .right .separator { opacity: 0.2; }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            padding: 0 24px;
            gap: 4px;
            flex-shrink: 0;
            overflow-x: auto;
            border-bottom: 1px solid #eee;
            transition: all 0.2s ease;
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        /* ===== CONTENT AREA ===== */
        .content-area {
            padding: 30px 35px;
            min-height: 400px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .panel {
            display: none;
            animation: fadeInUp 0.3s ease;
            flex: 1;
            min-height: 360px;
        }
        .panel.active { display: flex; flex-direction: column; }

        /* ===== HOME ===== */
        .home-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex: 1;
            border-radius: 12px;
            border: 1px solid #eee;
            padding: 30px;
            transition: all 0.2s ease;
        }
        .home-greeting {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
        }
        .home-greeting span { font-weight: 300; }
        .home-footer {
            margin-top: 25px;
            font-size: 0.6rem;
            letter-spacing: 4px;
            opacity: 0.4;
        }

        /* ============================================================
           MUSIC
           ============================================================ */
        .music-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }
        .music-container::-webkit-scrollbar { width: 4px; }
        .music-container::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .music-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.08); border-radius: 4px; }

        .music-player {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #eee;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .music-player .song-title {
            font-size: 1.2rem;
            font-weight: 600;
        }
        .music-player .song-artist {
            font-size: 0.85rem;
            opacity: 0.5;
        }
        .music-player .controls {
            display: flex;
            gap: 24px;
            align-items: center;
            margin-top: 4px;
        }
        .music-player .controls button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .music-player .controls .play-btn { font-size: 2.2rem; }
        .music-player .progress-bar {
            width: 100%;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            background: rgba(0,0,0,0.06);
        }
        body.dark-mode .music-player .progress-bar { background: rgba(255,255,255,0.06); }
        .music-player .progress-bar .progress-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s ease-out;
            background: #1a1a1a;
        }
        body.dark-mode .music-player .progress-bar .progress-fill { background: #eee; }
        .music-player .time-info {
            font-size: 0.7rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            opacity: 0.4;
        }

        .playlist {
            width: 100%;
            flex-shrink: 0;
        }
        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
        }
        .playlist-item:hover { background: rgba(0,0,0,0.02); }
        .playlist-item.active { font-weight: 600; }
        .playlist-item .title { font-size: 0.95rem; }
        .playlist-item .duration { font-size: 0.8rem; opacity: 0.4; }

        .music-sub-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 12px;
            width: 100%;
        }
        .music-sub-btn {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 6px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .music-panel {
            display: none;
            width: 100%;
            animation: fadeInUp 0.3s ease;
        }
        .music-panel.active { display: block; }

        .lyrics-container {
            flex: 1;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid #eee;
            padding: 25px 30px;
            font-family: 'Inter', sans-serif;
            line-height: 2.2;
            font-size: 1rem;
            transition: all 0.2s ease;
            width: 100%;
        }
        .lyrics-container::-webkit-scrollbar { width: 4px; }
        .lyrics-container::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .lyrics-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 4px; }
        .lyrics-container .line { padding: 2px 0; }
        .lyrics-container .line.empty { height: 12px; }

        /* ============================================================
           SOCIAL - PLATAFORMAS
           ============================================================ */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            flex: 1;
            align-content: start;
            padding: 10px 0;
        }
        .social-card {
            border-radius: 14px;
            border: 1px solid #eee;
            padding: 18px 20px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: all 0.2s ease;
            animation: fadeInUp 0.3s ease;
            position: relative;
        }
        .social-card .platform-name {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .social-card .platform-user {
            font-size: 0.85rem;
            opacity: 0.6;
            font-weight: 400;
        }
        .social-card .platform-stats {
            font-size: 0.8rem;
            display: flex;
            gap: 16px;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .social-card .platform-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .social-card .platform-stats .num {
            font-weight: 600;
        }
        .social-card .platform-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .social-card .platform-actions a,
        .social-card .platform-actions button {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #ddd;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #1a1a1a;
            letter-spacing: 0.3px;
        }
        .social-card .platform-actions a:hover,
        .social-card .platform-actions button:hover {
            background: #1a1a1a;
            color: #fff;
            border-color: #1a1a1a;
        }
        body.dark-mode .social-card .platform-actions a,
        body.dark-mode .social-card .platform-actions button {
            color: #eee;
            border-color: #444;
        }
        body.dark-mode .social-card .platform-actions a:hover,
        body.dark-mode .social-card .platform-actions button:hover {
            background: #eee;
            color: #1a1a1a;
            border-color: #eee;
        }

        .panel-title {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
        }
        .panel-sub {
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 300;
            opacity: 0.5;
        }

        @media (max-width: 700px) {
            .top-bar { padding: 16px 20px; flex-direction: column; gap: 8px; }
            .top-bar .title { font-size: 1.1rem; }
            .top-bar .right { font-size: 0.7rem; gap: 8px; justify-content: center; }
            .top-bar .right .badge { padding: 3px 10px; font-size: 0.7rem; }
            .tab-btn { font-size: 0.8rem; padding: 10px 14px; }
            .content-area { padding: 20px; min-height: 360px; }
            .home-container { min-height: 280px; padding: 20px; }
            .home-greeting { font-size: 1.8rem; }
            .lyrics-container { min-height: 280px; padding: 20px; font-size: 0.9rem; }
            .music-container { max-width: 100%; }
            .music-player { padding: 16px 18px; }
            .social-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
            .social-card { padding: 14px 16px; }
            .social-card .platform-name { font-size: 1rem; }
            .panel-title { font-size: 1.4rem; }
            #loginScreen .title { font-size: 1.8rem; }
            #loginScreen .login-box { width: 260px; }
            #loginScreen .login-box button { font-size: 1rem; padding: 12px 16px; }
            .music-sub-btn { font-size: 0.75rem; padding: 4px 12px; }
        }
        @media (max-width: 450px) {
            .tabs { justify-content: center; padding: 0 10px; gap: 2px; }
            .tab-btn { font-size: 0.7rem; padding: 8px 12px; }
            .home-container { min-height: 240px; }
            .home-greeting { font-size: 1.4rem; }
            .lyrics-container { min-height: 240px; padding: 15px; font-size: 0.8rem; }
            .music-player { padding: 12px 14px; }
            .music-player .controls button { font-size: 1.2rem; }
            .music-player .controls .play-btn { font-size: 1.8rem; }
            .playlist-item { padding: 8px 12px; font-size: 0.85rem; }
            .social-grid { grid-template-columns: 1fr; gap: 10px; }
            .social-card { padding: 12px 14px; }
            .social-card .platform-name { font-size: 0.95rem; }
            .social-card .platform-stats { font-size: 0.7rem; gap: 10px; }
            .social-card .platform-actions a,
            .social-card .platform-actions button { font-size: 0.7rem; padding: 4px 12px; }
            .top-bar .right .badge { font-size: 0.6rem; padding: 2px 8px; }
            #loginScreen .title { font-size: 1.4rem; }
            #loginScreen .login-box { width: 220px; }
            #loginScreen .login-box input { padding: 10px 14px; font-size: 0.9rem; }
            #loginScreen .login-box button { font-size: 0.9rem; padding: 10px 14px; }
            .music-sub-btn { font-size: 0.7rem; padding: 3px 8px; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="loginScreen">
        <div class="title">✦ <span>Welcome</span></div>
        <div class="login-box">
            <input type="text" id="nameInput" placeholder="Enter your name..." autofocus />
            <button id="loginBtn">Give your soul</button>
            <div class="error" id="loginError"></div>
        </div>
    </div>

    <!-- ===== CONTENEDOR PRINCIPAL ===== -->
    <div class="container" id="mainContainer">
        <div class="top-bar">
            <div class="title">✦ <span id="greetingDisplay">Welcome</span></div>
            <div class="right">
                <span class="badge" id="ipBadge">
                    <span class="icon">◈</span>
                    <span id="ipDisplay">0.0.0.0</span>
                </span>
                <span class="separator">|</span>
                <span class="badge" id="clockBadge">
                    <span id="clockDisplay">--:--:--</span>
                </span>
                <span class="separator">|</span>
                <span class="badge" id="visitasBadge">
                    <span class="icon">◈</span>
                    <span id="visitasDisplay">0</span>
                </span>
                <span class="separator">|</span>
                <button id="themeToggle" title="Toggle theme">◈</button>
            </div>
        </div>

        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-tab="home">Home</button>
            <button class="tab-btn" data-tab="music">Music</button>
            <button class="tab-btn" data-tab="about">Social</button>
        </div>

        <div class="content-area">

            <!-- ===== HOME ===== -->
            <div class="panel active" id="panel-home">
                <div class="home-container">
                    <div class="home-greeting">Hey, <span id="userNameDisplay">guest</span></div>
                    <div class="home-footer">✦ ✦ ✦</div>
                </div>
            </div>

            <!-- ===== MUSIC ===== -->
            <div class="panel" id="panel-music">
                <div class="panel-title">Music</div>
                <div class="panel-sub">E N T R Y &nbsp; L O G</div>
                <div class="music-container">
                    <div class="music-sub-tabs" id="musicSubTabs">
                        <button class="music-sub-btn active" data-sub="player">Player</button>

        const roblox = socialData.platforms.find(p => p.id === 'roblox');
        if (!roblox) return;

        try {
            const userId = roblox.userId;
            // Obtener seguidores
            const followersRes = await fetch(`https://friends.roblox.com/v1/users/${userId}/followers?limit=1`);
            const followersData = await followersRes.json();
            const followers = followersData.count || 0;

            // Obtener seguidos
            const followingRes = await fetch(`https://friends.roblox.com/v1/users/${userId}/followings?limit=1`);
            const followingData = await followingRes.json();
            const following = followingData.count || 0;

            // Actualizar UI
            const followersEl = document.getElementById('roblox-followers');
            const followingEl = document.getElementById('roblox-following');
            if (followersEl) followersEl.textContent = formatNumber(followers);
            if (followingEl) followingEl.textContent = formatNumber(following);

            console.log(`Roblox: ${followers} seguidores, ${following} siguiendo`);
        } catch (e) {
            console.error('Error al obtener datos de Roblox:', e);
        }
    }

    // ============================================================

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => showNotification('Copied: ' + text))
                .catch(() => copyFallback(text));
        } else {
            copyFallback(text);
        }
    }

    function copyFallback(text) {
        const input = document.createElement('input');
        input.value = text;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try {
            document.execCommand('copy');
            showNotification('Copied: ' + text);
        } catch (e) {
            showNotification('Error copying');
        }
        document.body.removeChild(input);
    }

    function showNotification(msg) {
        const div = document.createElement('div');
        div.textContent = msg;
        div.style.cssText = `
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #f5f5f5; color: #333; padding: 12px 28px;
            border: 1px solid #ddd; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 500;
            z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            letter-spacing: 0.5px; text-align: center;
        `;
        document.body.appendChild(div);
        setTimeout(() => {
            div.style.opacity = '0';
            div.style.transition = 'opacity 0.5s ease';
            setTimeout(() => div.remove(), 600);
        }, 2000);
    }

        if (isDragging) {
            const rect = progressBar.getBoundingClientRect();
            let percent = (e.clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            audioPlayer.currentTime = percent * audioPlayer.duration;
            progressFill.style.width = percent * 100 + '%';
