<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paradise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="IMG_5340.ico"> 
    
    <!-- Firebase SDK -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js"
      }
    }
    </script>

    <style>
        /* ============================================================
           RESET
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ============================================================
           THEMES (LIGHT / DARK)
           ============================================================ */
        
        /* LIGHT MODE */
        body.light-mode {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        body.light-mode .container { background: #ffffff; }
        body.light-mode .top-bar { background: #ffffff; border-bottom-color: #eee; }
        body.light-mode .top-bar .title { color: #1a1a1a; }
        body.light-mode .top-bar .badge { background: #f5f5f5; border-color: #eee; color: #888; }
        body.light-mode .top-bar .separator { color: #ddd; }
        body.light-mode .tabs { background: #fafafa; border-bottom-color: #eee; }
        body.light-mode .tab-btn { color: #888; }
        body.light-mode .tab-btn.active { color: #1a1a1a; border-bottom-color: #1a1a1a; }
        body.light-mode .tab-btn:hover { color: #333; background: rgba(0,0,0,0.03); }
        body.light-mode .home-container { background: #fafafa; border-color: #eee; }
        body.light-mode .home-greeting { color: #1a1a1a; }
        body.light-mode .home-greeting span { color: #888; }
        body.light-mode .home-sub { color: #888; }
        body.light-mode .home-footer { color: #ccc; }
        body.light-mode .music-player { background: #fafafa; border-color: #eee; }
        body.light-mode .music-player .song-title { color: #1a1a1a; }
        body.light-mode .music-player .song-artist { color: #888; }
        body.light-mode .music-player .controls button { color: #555; }
        body.light-mode .music-player .controls button:hover { color: #1a1a1a; background: #eee; }
        body.light-mode .music-player .controls .play-btn { color: #1a1a1a; }
        body.light-mode .progress-bar { background: #e0e0e0; }
        body.light-mode .progress-bar .progress-fill { background: #1a1a1a; }
        body.light-mode .time-info { color: #999; }
        body.light-mode .lyrics-container { background: #fafafa; border-color: #eee; color: #444; }
        body.light-mode .social-btn { background: #f5f5f5; border-color: #e8e8e8; color: #333; }
        body.light-mode .social-btn:hover { background: #eee; border-color: #ccc; }
        body.light-mode .playlist-item { border-bottom-color: #f0f0f0; color: #333; }
        body.light-mode .playlist-item:hover { background: #f5f5f5; }
        body.light-mode .playlist-item.active { background: #f0f0f0; }
        body.light-mode #loginScreen { background: #ffffff; }
        body.light-mode #loginScreen .title { color: #1a1a1a; }
        body.light-mode #loginScreen .login-box input { background: #fafafa; border-color: #ddd; color: #1a1a1a; }
        body.light-mode #loginScreen .login-box input:focus { border-color: #1a1a1a; background: #ffffff; }
        body.light-mode #loginScreen .login-box button { background: #1a1a1a; color: #ffffff; }
        body.light-mode #loginScreen .login-box button:hover { background: #333; }
        body.light-mode .panel-title { color: #1a1a1a; }
        body.light-mode .panel-sub { color: #999; }
        body.light-mode #themeToggle { border-color: #ddd; color: #333; }
        body.light-mode #themeToggle:hover { background: #eee; }
        body.light-mode .switch-btn { background: #f5f5f5; border-color: #ddd; color: #333; }
        body.light-mode .switch-btn:hover { background: #eee; }
        body.light-mode .wall-post { background: #fafafa; border-color: #eee; }
        body.light-mode .wall-post .author { color: #1a1a1a; }
        body.light-mode .wall-post .date { color: #999; }
        body.light-mode .wall-post .content { color: #333; }

        /* DARK MODE */
        body.dark-mode {
            background: #0a0a0a;
            color: #eee;
        }
        body.dark-mode .container { background: #111; }
        body.dark-mode .top-bar { background: #1a1a1a; border-bottom-color: #2a2a2a; }
        body.dark-mode .top-bar .title { color: #eee; }
        body.dark-mode .top-bar .badge { background: #2a2a2a; border-color: #333; color: #aaa; }
        body.dark-mode .top-bar .separator { color: #444; }
        body.dark-mode .tabs { background: #1a1a1a; border-bottom-color: #2a2a2a; }
        body.dark-mode .tab-btn { color: #888; }
        body.dark-mode .tab-btn.active { color: #eee; border-bottom-color: #eee; }
        body.dark-mode .tab-btn:hover { color: #eee; background: rgba(255,255,255,0.05); }
        body.dark-mode .home-container { background: #1a1a1a; border-color: #2a2a2a; }
        body.dark-mode .home-greeting { color: #eee; }
        body.dark-mode .home-greeting span { color: #888; }
        body.dark-mode .home-sub { color: #888; }
        body.dark-mode .home-footer { color: #444; }
        body.dark-mode .music-player { background: #1a1a1a; border-color: #2a2a2a; }
        body.dark-mode .music-player .song-title { color: #eee; }
        body.dark-mode .music-player .song-artist { color: #888; }
        body.dark-mode .music-player .controls button { color: #888; }
        body.dark-mode .music-player .controls button:hover { color: #eee; background: #2a2a2a; }
        body.dark-mode .music-player .controls .play-btn { color: #eee; }
        body.dark-mode .progress-bar { background: #2a2a2a; }
        body.dark-mode .progress-bar .progress-fill { background: #eee; }
        body.dark-mode .time-info { color: #888; }
        body.dark-mode .lyrics-container { background: #1a1a1a; border-color: #2a2a2a; color: #aaa; }
        body.dark-mode .social-btn { background: #1a1a1a; border-color: #2a2a2a; color: #888; }
        body.dark-mode .social-btn:hover { background: #2a2a2a; border-color: #444; color: #eee; }
        body.dark-mode .playlist-item { border-bottom-color: #2a2a2a; color: #888; }
        body.dark-mode .playlist-item:hover { background: #1a1a1a; }
        body.dark-mode .playlist-item.active { background: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen { background: #0a0a0a; }
        body.dark-mode #loginScreen .title { color: #eee; }
        body.dark-mode #loginScreen .title span { color: #888; }
        body.dark-mode #loginScreen .login-box input { background: #1a1a1a; border-color: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen .login-box input:focus { border-color: #eee; background: #1a1a1a; }
        body.dark-mode #loginScreen .login-box button { background: #2a2a2a; color: #eee; }
        body.dark-mode #loginScreen .login-box button:hover { background: #333; }
        body.dark-mode .panel-title { color: #eee; }
        body.dark-mode .panel-sub { color: #888; }
        body.dark-mode #themeToggle { border-color: #444; color: #ccc; }
        body.dark-mode #themeToggle:hover { background: #2a2a2a; }
        body.dark-mode .switch-btn { background: #1a1a1a; border-color: #444; color: #ccc; }
        body.dark-mode .switch-btn:hover { background: #2a2a2a; }
        body.dark-mode .wall-post { background: #1a1a1a; border-color: #2a2a2a; }
        body.dark-mode .wall-post .author { color: #eee; }
        body.dark-mode .wall-post .date { color: #888; }
        body.dark-mode .wall-post .content { color: #aaa; }

        /* ============================================================
           ROLES
           ============================================================ */
        .role-icon {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 4px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
            cursor: help;
        }
        .role-icon:hover {
            transform: scale(1.2);
        }

        .role-owner .role-icon {
            box-shadow: 0 0 15px #ffd700, 0 0 30px #ffd70066;
            animation: glowCrown 1.5s ease-in-out infinite alternate;
        }

        @keyframes glowCrown {
            0% { box-shadow: 0 0 10px #ffd700, 0 0 20px #ffd70044; }
            100% { box-shadow: 0 0 25px #ffd700, 0 0 50px #ffd70088, 0 0 75px #ffd70044; }
        }

        .wall-post .author {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ============================================================
           WALL (MURO)
           ============================================================ */
        .wall-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .wall-container::-webkit-scrollbar { width: 4px; }
        .wall-container::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
        .wall-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .wall-input-area {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .wall-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
            background: #fafafa;
        }
        .wall-input-area input:focus { border-color: #1a1a1a; }
        .wall-input-area button {
            padding: 10px 20px;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            flex-shrink: 0;
        }
        .wall-input-area button:hover { background: #333; }

        .wall-posts {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .wall-posts::-webkit-scrollbar { width: 4px; }
        .wall-posts::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
        .wall-posts::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .wall-post {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 12px 16px;
            transition: all 0.2s ease;
            position: relative;
        }
        .wall-post .date {
            font-size: 0.7rem;
            margin-left: 10px;
            color: #999;
        }
        .wall-post .content {
            font-size: 0.95rem;
            margin-top: 4px;
            word-wrap: break-word;
        }
        .wall-post .delete-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            color: #cc3333;
            font-size: 0.8rem;
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }
        .wall-post .delete-btn:hover { opacity: 1; }

        /* ============================================================
           COMMON ELEMENTS
           ============================================================ */

        #themeToggle {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        #logoutBtn {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            color: #888;
            background: #f5f5f5;
        }
        #logoutBtn:hover {
            background: #eee;
            border-color: #ccc;
            color: #333;
        }
        body.dark-mode #logoutBtn {
            border-color: #444;
            color: #aaa;
            background: #2a2a2a;
        }
        body.dark-mode #logoutBtn:hover {
            background: #333;
            border-color: #555;
            color: #eee;
        }

        .switch-btn {
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
            width: 100%;
            margin-top: 4px;
        }

        #loginScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease;
        }
        #loginScreen .title {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
        }
        #loginScreen .title span { color: #888; font-weight: 300; }
        #loginScreen .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 320px;
            max-width: 90%;
        }
        #loginScreen .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }
        #loginScreen .login-box input:focus { border-color: #1a1a1a; }
        #loginScreen .login-box button {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        #loginScreen .login-box .error {
            color: #cc3333;
            font-size: 0.85rem;
            font-weight: 400;
            height: 20px;
            text-align: center;
        }
        #loginScreen .login-box .success {
            color: #33aa33;
            font-size: 0.85rem;
            font-weight: 400;
            height: 20px;
            text-align: center;
        }

        .container {
            width: 900px;
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.8s ease, background 0.3s ease;
            position: relative;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }
        .container.active { opacity: 1; }

        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            border-radius: 16px;
        }

        .top-bar {
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .top-bar .title {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }
        .top-bar .title span { font-weight: 300; transition: color 0.3s ease; }
        .top-bar .right {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.3s ease;
            flex-wrap: wrap;
        }
        .top-bar .right .badge {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #eee;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }
        .top-bar .right .badge .icon { font-size: 0.8rem; opacity: 0.6; }
        .top-bar .right .separator { transition: color 0.3s ease; }

        .tabs {
            display: flex;
            padding: 0 20px;
            gap: 4px;
            position: relative;
            z-index: 1;
            flex-shrink: 0;
            overflow-x: auto;
            transition: all 0.3s ease;
        }
        .tab-btn {
            background: transparent;
            border: none;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 14px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .content-area {
            padding: 30px 35px;
            min-height: 380px;
            position: relative;
            z-index: 1;
            flex: 1;
            overflow: hidden;
            transition: background 0.3s ease;
        }
        .panel {
            display: none;
            animation: fadeIn 0.3s ease;
            height: 100%;
        }
        .panel.active { display: block; }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .home-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 380px;
            border-radius: 10px;
            border: 1px solid #eee;
            padding: 30px;
            transition: all 0.3s ease;
        }
        .home-greeting {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }
        .home-greeting span { font-weight: 300; transition: color 0.3s ease; }
        .home-sub {
            font-size: 1rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        .home-footer {
            margin-top: 25px;
            font-size: 0.6rem;
            letter-spacing: 4px;
            transition: color 0.3s ease;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-top: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .social-btn {
            border: 1px solid #e8e8e8;
            border-radius: 10px;
            padding: 14px 12px;
            text-align: center;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            display: block;
            letter-spacing: 0.3px;
        }

        .panel-title {
            font-size: 1.8rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.5px;
            transition: color 0.3s ease;
        }
        .panel-sub {
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 3px;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 300;
            transition: color 0.3s ease;
        }

        /* ===== MUSIC ===== */
        .music-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .music-container::-webkit-scrollbar { width: 4px; }
        .music-container::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
        .music-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        .music-player {
            width: 100%;
            max-width: 500px;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }
        .music-player .song-title {
            font-size: 1.2rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .music-player .song-artist {
            font-size: 0.85rem;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        .music-player .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 5px;
        }
        .music-player .controls button {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .music-player .controls .play-btn { font-size: 2rem; }
        .music-player .progress-bar {
            width: 100%;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            transition: background 0.3s ease;
        }
        .music-player .progress-bar .progress-fill {
            height: 100%;
            border-radius: 4px;
            width: 0%;
            transition: width 0.1s linear, background 0.3s ease;
        }
        .music-player .time-info {
            font-size: 0.7rem;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transition: color 0.3s ease;
        }

        .playlist {
            width: 100%;
            max-width: 500px;
            flex-shrink: 0;
        }
        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 6px;
        }
        .playlist-item .title { font-size: 0.95rem; }
        .playlist-item .duration { font-size: 0.8rem; }

        .lyrics-container {
            height: 380px;
            overflow-y: auto;
            border-radius: 10px;
            border: 1px solid #eee;
            padding: 25px 30px;
            font-family: 'Inter', sans-serif;
            line-height: 2;
            font-size: 1rem;

        createUserWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
                return updateProfile(userCredential.user, { displayName: displayName })

                    });
            })
            .catch((error) => {
                let msg = 'Registration error.';
                if (error.code === 'auth/email-already-in-use') msg = 'Email already registered.';
                else if (error.code === 'auth/weak-password') msg = 'Password must be at least 6 characters.';
                else if (error.code === 'auth/invalid-email') msg = 'Invalid email.';
                showError(msg);
                console.error('Error:', error.message);
            });
    }

    function loginUser(email, password) {
        signInWithEmailAndPassword(auth, email, password)

                const displayName = user?.displayName || user?.email?.split('@')[0] || 'user';

        const q = query(collection(db, 'posts'), orderBy('timestamp', 'desc'));
        
        onSnapshot(q, (snapshot) => {
            wallPosts.innerHTML = '';
            if (snapshot.empty) {
                wallPosts.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">No posts yet. Be the first!</div>';
                return;
            }
            snapshot.forEach((doc) => {
                const data = doc.data();
                const postId = doc.id;
                const isAuthor = currentUser && data.uid === currentUser.uid;
                
                const postDiv = document.createElement('div');
                postDiv.className = 'wall-post';
                
                const date = data.timestamp ? new Date(data.timestamp.seconds * 1000) : new Date();
                const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                
                const authorName = data.author || 'Anonymous';
                const roleData = getRoleIcon(data.uid);
                
                postDiv.innerHTML = `
                    <span class="author ${roleData.className}">
                        ${roleData.icon}
                        ${authorName}
                    </span>
                    <span class="date">${dateStr}</span>
                    ${isAuthor ? `<button class="delete-btn" data-id="${postId}">✕</button>` : ''}
                    <div class="content">${data.text || ''}</div>
                `;
                
                const deleteBtn = postDiv.querySelector('.delete-btn');
                if (deleteBtn) {
                    deleteBtn.addEventListener('click', async () => {
                        if (confirm('Delete this post?')) {

                        }
                    });

                wallPosts.appendChild(postDiv);
            });
            wallPosts.scrollTop = 0;
        }, (error) => {
            console.error('Error loading posts:', error);
            wallPosts.innerHTML = '<div style="text-align:center;color:#cc3333;padding:20px;">Error loading posts.</div>';

                timestamp: serverTimestamp()

    // ============================================================
    let visits = parseInt(localStorage.getItem('draco_visitas')) || 0;
    visits += 1;
    localStorage.setItem('draco_visitas', visits);
    visitasDisplay.textContent = visits;

    function updateGlobalCounter() {
        const COUNTER_NAME = 'draco_visitas_global';
        fetch('https://api-count.com/api/v1/counters/' + COUNTER_NAME + '/increment')
            .then(r => r.json())
            .then(data => {
                if (visitasGlobal) visitasGlobal.textContent = data.count || '?';
            })
            .catch(() => {
                if (visitasGlobal) visitasGlobal.textContent = '?';
                console.log('Global counter error');
            });
    }

    // ============================================================
    // 13. IP
    // ============================================================
    function getIP() {
        fetch('https://api.ipify.org?format=json')
            .then(r => r.json())
            .then(data => { ipDisplay.textContent = data.ip || '0.0.0.0'; })
            .catch(() => { ipDisplay.textContent = '0.0.0.0'; });
    }

    // ============================================================
    // 14. PARTICLES
    // ============================================================
    function initParticles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            const rect = mainContainer.getBoundingClientRect();
            width = rect.width;
            height = rect.height;
            canvas.width = width;
            canvas.height = height;
        }

        function createParticles(count) {
            particles = [];
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    r: 1.5 + Math.random() * 2,
                    alpha: 0.2 + Math.random() * 0.3,
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, width, height);
            for (const p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,' + p.alpha + ')';
                ctx.fill();
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
            }
            requestAnimationFrame(drawParticles);
        }

        resize();
        createParticles(45);
        drawParticles();

        window.addEventListener('resize', () => {
            resize();
            createParticles(45);
        });
    }

    // ============================================================
    // 15. MUSIC PLAYER
    // ============================================================
    function loadSong(index) {
        const song = playlist[index];
        currentIndex = index;
        audioPlayer.src = 'https://d-gq.github.io/' + song.file;
        currentSongTitle.textContent = song.title;
        lyricsSub.textContent = song.title.toUpperCase();
        renderLyrics(song.lyrics);
        updatePlaylistUI();
        if (isPlaying) {
            audioPlayer.play().catch(e => console.log('Error:', e));
        }
    }

    function renderLyrics(lyricsArray) {
        let html = '';
        lyricsArray.forEach(line => {
            if (line === '') {
                html += `<div class="line empty"></div>`;
            } else {
                html += `<div class="line">${line}</div>`;
            }
        });
        lyricsContainer.innerHTML = html;
    }

    function updatePlaylistUI() {
        const items = document.querySelectorAll('.playlist-item');
        items.forEach((item, i) => {
            item.classList.toggle('active', i === currentIndex);
        });
    }

    function togglePlay() {
        if (audioPlayer.paused) {
            audioPlayer.play().catch(e => console.log('Error:', e));
            isPlaying = true;
            playBtn.textContent = '⏸';
        } else {
            audioPlayer.pause();
            isPlaying = false;
            playBtn.textContent = '▶';
        }
    }

    function nextSong() {
        const next = (currentIndex + 1) % playlist.length;
        isPlaying = true;
        loadSong(next);
        audioPlayer.play().catch(e => console.log('Error:', e));
        playBtn.textContent = '⏸';
    }

    function prevSong() {
        const prev = (currentIndex - 1 + playlist.length) % playlist.length;
        isPlaying = true;
        loadSong(prev);
        audioPlayer.play().catch(e => console.log('Error:', e));
        playBtn.textContent = '⏸';
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins + ':' + String(secs).padStart(2, '0');
    }

    function updateProgress() {
        if (!isDragging) {
            const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100 || 0;
            progressFill.style.width = percent + '%';
            currentTimeDisplay.textContent = formatTime(audioPlayer.currentTime);
            totalTimeDisplay.textContent = formatTime(audioPlayer.duration);
        }
    }

    function generatePlaylist() {
        let html = '';
        playlist.forEach((song, index) => {
            html += `
                <div class="playlist-item" data-index="${index}">
                    <span class="title">${song.title}</span>
                    <span class="duration">${index + 1}</span>
                </div>
            `;
        });
        playlistContainer.innerHTML = html;

        document.querySelectorAll('.playlist-item').forEach(item => {
            item.addEventListener('click', function() {
                const index = parseInt(this.dataset.index);
                isPlaying = true;
                loadSong(index);
                audioPlayer.play().catch(e => console.log('Error:', e));
                playBtn.textContent = '⏸';
            });
        });
    }

    // ============================================================
    // 16. SOCIAL BUTTONS
    // ============================================================
    function generateSocialButtons(profiles) {
        let html = '';
        profiles.forEach(p => {
            if (p.type === 'discord') {
                html += `
                    <button class="social-btn discord-copy" data-copy="${p.value}">
                        Discord
                    </button>
                `;
            } else if (p.type === 'link') {
                html += `
                    <a href="${p.url}" target="_blank" class="social-btn">
                        ${p.name}
                    </a>
                `;
            }
        });
        return html;
    }

    const socialProfiles = [
        { type: 'link', name: 'Roblox', url: 'https://www.roblox.com/es/users/10752298002/profile' },
        { type: 'link', name: 'Instagram', url: 'https://www.instagram.com/omofagia' },
        { type: 'discord', value: 'v.y.r' },
        { type: 'link', name: 'Telegram', url: 'https://t.me/caquexia' },
        { type: 'link', name: 'GitHub', url: 'https://github.com/d-gq' },
    ];

    // ============================================================
    // 17. COPY TO CLIPBOARD
    // ============================================================
    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text)
                .then(() => showNotification('Copied: ' + text))
                .catch(() => copyFallback(text));
        } else {
            copyFallback(text);
        }
    }

    function copyFallback(text) {
        const input = document.createElement('input');
        input.value = text;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        try {
            document.execCommand('copy');
            showNotification('Copied: ' + text);
        } catch (e) {
            showNotification('Error copying');
        }
        document.body.removeChild(input);
    }

    function showNotification(msg) {
        const div = document.createElement('div');
        div.textContent = msg;
        div.style.cssText = `
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #f5f5f5; color: #333; padding: 12px 28px;
            border: 1px solid #ddd; border-radius: 8px;
            font-family: 'Inter', sans-serif; font-weight: 500;
            z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            letter-spacing: 0.5px; text-align: center;
        `;
        document.body.appendChild(div);
        setTimeout(() => {
            div.style.opacity = '0';
            div.style.transition = 'opacity 0.5s ease';
            setTimeout(() => div.remove(), 600);
        }, 2500);
    }

    // ============================================================
    // 18. TABS
    // ============================================================
    function initTabs() {
        tabs.forEach(btn => {
            btn.addEventListener('click', function() {
                tabs.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tab = this.dataset.tab;
                Object.keys(panels).forEach(key => {
                    panels[key].classList.toggle('active', key === tab);
                });
            });
        });
    }

    // ============================================================
    // 19. MUSIC EVENTS
    // ============================================================
    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', prevSong);
    nextBtn.addEventListener('click', nextSong);

    audioPlayer.addEventListener('timeupdate', updateProgress);
    audioPlayer.addEventListener('ended', nextSong);

    progressBar.addEventListener('mousedown', function(e) {
        isDragging = true;
        const rect = this.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        audioPlayer.currentTime = percent * audioPlayer.duration;
        progressFill.style.width = percent * 100 + '%';
    });

    document.addEventListener('mousemove', function(e) {
        if (isDragging) {
            const rect = progressBar.getBoundingClientRect();
            let percent = (e.clientX - rect.left) / rect.width;
            percent = Math.max(0, Math.min(1, percent));
            audioPlayer.currentTime = percent * audioPlayer.duration;
            progressFill.style.width = percent * 100 + '%';
        }
    });

    document.addEventListener('mouseup', function() {
        isDragging = false;
    });

    // ============================================================
    // 20. INIT SOCIAL
    // ============================================================
    document.getElementById('social-about').innerHTML = generateSocialButtons(socialProfiles);
    document.querySelectorAll('.discord-copy').forEach(btn => {
        btn.addEventListener('click', function() {
            const text = this.dataset.copy;
            if (text) copyToClipboard(text);
        });
    });

    // ============================================================
    // 21. INIT TABS
    // ============================================================
    initTabs();

    console.log('Paradise - Loaded with Firebase Auth + Firestore + Roles');
    </script>
